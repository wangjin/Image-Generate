name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
      proxy_prefix:
        description: "Proxy prefix baked into latest.json asset URLs"
        required: false
        default: "https://gh-proxy.org/"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check & frontend build (tsc + vite)
        run: pnpm build

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact_name: ImageGenerate-macos
            artifact_path: dist-release/*
          - os: windows-latest
            artifact_name: ImageGenerate-windows
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig
    runs-on: ${{ matrix.os }}
    env:
      # updater 产物（mac .app.tar.gz / win nsis .exe）的 minisign 签名密钥
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build app (tauri build)
        run: pnpm tauri build
      - name: Repack updater artifacts from deep-signed app (macOS only)
        if: matrix.os == 'macos-15'
        run: bash scripts/make-updater-artifacts.sh src-tauri/target/release/bundle/macos dist-release
      - name: Deep ad-hoc sign & repack DMG (macOS only)
        if: matrix.os == 'macos-15'
        run: bash scripts/make-dmg.sh src-tauri/target/release/bundle/macos/ImageGenerate.app dist-release
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then RANGE="HEAD"; else RANGE="$PREV_TAG..HEAD"; fi
          {
            echo "## ✨ 新功能"
            echo ""
            git log "$RANGE" --format="- %s" --grep="feat" -i 2>/dev/null || true
            echo ""
            echo "## 🐛 修复"
            echo ""
            git log "$RANGE" --format="- %s" --grep="fix" -i 2>/dev/null || true
            echo ""
            echo "## 📦 下载"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|------|------|"
            echo "| macOS | \`ImageGenerate_*.dmg\` |"
            echo "| Windows | \`ImageGenerate_*-setup.exe\` |"
            echo ""
            echo "## 💻 macOS 使用说明"
            echo ""
            echo "应用未做 Apple 公证（免费发行的限制），首次打开若提示\"已损坏\"或\"无法验证\"，"
            echo "在终端执行一条命令即可："
            echo ""
            echo '```bash'
            echo "xattr -cr /Applications/ImageGenerate.app"
            echo '```'
            echo ""
            echo "之后双击打开，无需再操作。"
          } > /tmp/release-notes.md
          {
            echo "body<<RELEASEEOF"
            cat /tmp/release-notes.md
            echo "RELEASEEOF"
          } >> "$GITHUB_OUTPUT"
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          PROXY_PREFIX: ${{ github.event.inputs.proxy_prefix || 'https://gh-proxy.org/' }}
        run: |
          python3 scripts/make-latest-json.py \
            --tag "$TAG" \
            --notes-file /tmp/release-notes.md \
            --mac-dir artifacts/ImageGenerate-macos \
            --win-dir artifacts/ImageGenerate-windows \
            --proxy-prefix "$PROXY_PREFIX" \
            --out latest.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/ImageGenerate-macos/*.dmg
            artifacts/ImageGenerate-windows/*.exe
            artifacts/ImageGenerate-macos/*.app.tar.gz
            artifacts/ImageGenerate-macos/*.app.tar.gz.sig
            artifacts/ImageGenerate-windows/*-setup.exe.sig
            latest.json
